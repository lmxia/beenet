[workspace]
resolver = "2"
members = [
    "crates/beenet-common",
    "crates/beenet-proto",
    "crates/beenet-manifest",
    "crates/beenet-pack",
    "crates/beenet-worker",
    "crates/beenet-gateway",
]
exclude = [
    "examples",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
authors = ["Beenet Contributors"]
license = "Apache-2.0"
repository = "https://github.com/beenet/beenet"

[workspace.dependencies]
# ---- internal ----
beenet-common   = { path = "crates/beenet-common" }
beenet-proto    = { path = "crates/beenet-proto" }
beenet-manifest = { path = "crates/beenet-manifest" }

# ---- core runtime ----
wasmtime          = { version = "43", features = ["component-model-async"] }
wasmtime-wasi     = { version = "43" }
wasmtime-wasi-http = { version = "43", features = ["component-model-async"] }
wasm-encoder      = "0.245"
wasmparser        = "0.245"
wasm-metadata     = "0.245"

# ---- async / runtime ----
tokio = { version = "1", features = ["full"] }
futures = "0.3"
async-trait = "0.1"

# ---- http ----
http = "1"
http-body = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["tokio"] }
axum = "0.7"

# ---- libp2p ----
# M1 uses request-response with CBOR codec for our InvokeRequest/Response
libp2p = { version = "0.56", default-features = false, features = [
    "tokio",
    "tcp",
    "noise",
    "yamux",
    "request-response",
    "cbor",
    "identify",
    "ping",
    "macros",
] }

# ---- serde / encoding ----
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
toml = "0.8"

# ---- utils ----
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
moka = { version = "0.12", features = ["future"] }
cid = "0.11"
multihash = "0.19"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
