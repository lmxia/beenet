# Local / host-side config used by:
#   beenet-worker --config examples/local-dev-config.toml
#   Beenet Cloud publishes artifacts by CID in hosted environments.
#   beenet-gateway --config examples/local-dev-config.toml   (native only)
#
# Docker Compose gateway/registry do NOT read this file (they use CLI flags).

[gateway]
http_addr = "127.0.0.1:8080"
registry_url = "http://127.0.0.1:3030"
libp2p_listen_addr = "/ip4/0.0.0.0/tcp/4001"
# public_addr = "/ip4/127.0.0.1/tcp/4001"
identity_key_path = "gateway_cache/identity.key"
# Display name (duplicates ok). CLI: --gateway-id / --name
# If omitted, a Docker-style name is generated and saved next to identity.key.
# gateway_id = "local-gw"

[worker]
registry_url = "http://127.0.0.1:3030"
# Display name (duplicates ok; PeerId is the identity). Override with --name.
# If omitted, a Docker-style name is generated and saved as wasm_cache/display_name.
# name = "dev-worker"
# Beenet Cloud MinIO public read (bucket `beenet`, path-style URL)
wasm_fetch_base = "http://127.0.0.1:9000/beenet"

[oss]
endpoint = "http://127.0.0.1:9000"
bucket = "beenet"
access_key_id = "minioadmin"
access_key_secret = "minioadmin"
region = "us-east-1"
force_path_style = true
