name: macos-contributor

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  guest-image:
    name: Linux guest image
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout Beenet
        uses: actions/checkout@v4
        with:
          path: beenet

      - name: Restore guest image cache
        id: guest
        uses: actions/cache@v4
        with:
          path: beenet/out/guest
          key: macos-guest-${{ hashFiles('beenet/scripts/spin.rev', 'beenet/scripts/build-macos-vm-image.sh', 'beenet/deploy/docker/Dockerfile.worker-vm', 'beenet/deploy/macos-contributor/guest/alpine-init', 'beenet/Cargo.lock', 'beenet/Cargo.toml', 'beenet/crates/beenet-worker/**', 'beenet/crates/beenet-factors/**', 'beenet/crates/beenet-common/**') }}

      - name: Read Spin revision
        if: steps.guest.outputs.cache-hit != 'true'
        id: spin
        run: echo "rev=$(tr -d '[:space:]' < beenet/scripts/spin.rev)" >> "$GITHUB_OUTPUT"

      - name: Restore Spin checkout
        if: steps.guest.outputs.cache-hit != 'true'
        id: spin-cache
        uses: actions/cache@v4
        with:
          path: spin
          key: spin-${{ steps.spin.outputs.rev }}-submodules

      - name: Checkout Spin
        if: steps.guest.outputs.cache-hit != 'true' && steps.spin-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: spinframework/spin
          ref: ${{ steps.spin.outputs.rev }}
          path: spin
          submodules: recursive

      - name: Set up Docker Buildx
        if: steps.guest.outputs.cache-hit != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Install ISO tools
        if: steps.guest.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools cpio gzip

      - name: Build kernel and initramfs
        if: steps.guest.outputs.cache-hit != 'true'
        working-directory: beenet
        env:
          BEENET_VM_CACHE_DIR: ${{ runner.temp }}/beenet-vm
          BEENET_SPIN_DIR: ${{ github.workspace }}/spin
          BEENET_BUILDX_EXTRA_ARGS: --cache-from=type=gha,scope=macos-guest-worker --cache-to=type=gha,mode=max,scope=macos-guest-worker
        run: scripts/build-macos-vm-image.sh

      - name: Stage guest image
        if: steps.guest.outputs.cache-hit != 'true'
        run: |
          mkdir -p beenet/out/guest
          cp "${{ runner.temp }}/beenet-vm/extracted/boot/Image" beenet/out/guest/Image
          cp "${{ runner.temp }}/beenet-vm/beenet-alpine-3.24.1-aarch64-initramfs.img" \
            beenet/out/guest/initrd.img

      - name: Upload guest image
        uses: actions/upload-artifact@v4
        with:
          name: macos-guest-image
          path: beenet/out/guest/*
          if-no-files-found: error

  host-worker:
    name: macOS host worker
    runs-on: macos-15
    steps:
      - name: Checkout Beenet
        uses: actions/checkout@v4
        with:
          path: beenet

      - name: Read Spin revision
        id: spin
        run: echo "rev=$(tr -d '[:space:]' < beenet/scripts/spin.rev)" >> "$GITHUB_OUTPUT"

      - name: Restore Spin checkout
        id: spin-cache
        uses: actions/cache@v4
        with:
          path: spin
          key: spin-${{ steps.spin.outputs.rev }}-submodules

      - name: Checkout Spin
        if: steps.spin-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: spinframework/spin
          ref: ${{ steps.spin.outputs.rev }}
          path: spin
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: beenet
          shared-key: macos-beenet-worker

      - name: Build host Mach-O worker
        working-directory: beenet
        run: |
          uname -m
          cargo build --release -p beenet-worker
          file target/release/beenet-worker

      - name: Upload host worker
        uses: actions/upload-artifact@v4
        with:
          name: macos-host-worker
          path: beenet/target/release/beenet-worker
          if-no-files-found: error

  package:
    name: macOS arm64 DMG
    needs: [guest-image, host-worker]
    runs-on: macos-15
    steps:
      - name: Checkout Beenet
        uses: actions/checkout@v4
        with:
          path: beenet

      - name: Install vfkit
        run: brew install vfkit

      - name: Download guest image
        uses: actions/download-artifact@v4
        with:
          name: macos-guest-image
          path: ${{ github.workspace }}/guest

      - name: Download host worker
        uses: actions/download-artifact@v4
        with:
          name: macos-host-worker
          path: ${{ github.workspace }}/host-worker

      - name: Import Developer ID certificate
        if: startsWith(github.ref, 'refs/tags/')
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          test -n "$APPLE_CERTIFICATE_P12_BASE64"
          test -n "$APPLE_CERTIFICATE_PASSWORD"
          keychain="$RUNNER_TEMP/beenet-signing.keychain-db"
          security create-keychain -p "ci-keychain-password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "ci-keychain-password" "$keychain"
          printf '%s' "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$keychain"
          security list-keychains -d user -s "$keychain"
          security default-keychain -s "$keychain"
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "ci-keychain-password" "$keychain"

      - name: Store Apple notarization credentials
        if: startsWith(github.ref, 'refs/tags/')
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          test -n "$APPLE_ID"
          test -n "$APPLE_TEAM_ID"
          test -n "$APPLE_APP_SPECIFIC_PASSWORD"
          xcrun notarytool store-credentials beenet-notary \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --keychain "$RUNNER_TEMP/beenet-signing.keychain-db"

      - name: Package app and DMG
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: beenet
        env:
          BEENET_KERNEL_PATH: ${{ github.workspace }}/guest/Image
          BEENET_INITRD_PATH: ${{ github.workspace }}/guest/initrd.img
          BEENET_WORKER_BIN: ${{ github.workspace }}/host-worker/beenet-worker
          DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
          NOTARYTOOL_PROFILE: beenet-notary
        run: |
          chmod +x "$BEENET_WORKER_BIN"
          test -f "$BEENET_KERNEL_PATH"
          test -f "$BEENET_INITRD_PATH"
          test -n "$DEVELOPER_ID_APPLICATION"
          make release-macos-dmg
          stable="deploy/macos-contributor/dist/Beenet-macos-arm64.dmg"
          cp deploy/macos-contributor/dist/Beenet-notarized.dmg "$stable"
          ls -lh deploy/macos-contributor/dist/*.dmg

      - name: Package unsigned development DMG
        if: github.event_name == 'workflow_dispatch'
        working-directory: beenet
        env:
          BEENET_KERNEL_PATH: ${{ github.workspace }}/guest/Image
          BEENET_INITRD_PATH: ${{ github.workspace }}/guest/initrd.img
          BEENET_WORKER_BIN: ${{ github.workspace }}/host-worker/beenet-worker
        run: |
          chmod +x "$BEENET_WORKER_BIN"
          make dmg

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: Beenet-macos-arm64
          path: beenet/deploy/macos-contributor/dist/*.dmg
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: beenet
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ github.ref_name }}"
          gh release view "$tag" >/dev/null 2>&1 || \
            gh release create "$tag" --title "Beenet ${tag}" --generate-notes
          gh release upload "$tag" deploy/macos-contributor/dist/*.dmg --clobber
          gh release upload "$tag" deploy/macos-contributor/dist/Beenet-macos-arm64.dmg --clobber
