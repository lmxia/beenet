name: windows-contributor

on:
  pull_request:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: cargo check
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/'))
    runs-on: windows-2022
    steps:
      - name: Checkout Beenet
        uses: actions/checkout@v4
        with:
          path: beenet

      - name: Read Spin revision
        id: spin
        shell: bash
        run: echo "rev=$(tr -d '[:space:]' < beenet/scripts/spin.rev)" >> "$GITHUB_OUTPUT"

      - name: Checkout Spin
        uses: actions/checkout@v4
        with:
          repository: spinframework/spin
          ref: ${{ steps.spin.outputs.rev }}
          path: spin
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            beenet
            beenet/deploy/windows/app

      - name: Check beenet-worker
        working-directory: beenet
        run: cargo check -p beenet-worker

      - name: Check Windows app
        working-directory: beenet
        run: cargo check --manifest-path deploy/windows/app/Cargo.toml --target-dir target

  build:
    name: Windows x64 installer
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: windows-2022
    steps:
      - name: Checkout Beenet
        uses: actions/checkout@v4
        with:
          path: beenet

      - name: Read Spin revision
        id: spin
        shell: bash
        run: echo "rev=$(tr -d '[:space:]' < beenet/scripts/spin.rev)" >> "$GITHUB_OUTPUT"

      - name: Checkout Spin
        uses: actions/checkout@v4
        with:
          repository: spinframework/spin
          ref: ${{ steps.spin.outputs.rev }}
          path: spin
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            beenet
            beenet/deploy/windows/app

      - name: Build worker
        working-directory: beenet
        run: cargo build --release -p beenet-worker

      - name: Build Windows app
        working-directory: beenet
        run: cargo build --release --manifest-path deploy/windows/app/Cargo.toml --target-dir target

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compile installer
        working-directory: beenet
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '0.1.0' }
          New-Item -ItemType Directory -Force -Path out\windows | Out-Null
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }
          & $iscc `
            "/DMyAppVersion=$version" `
            "/DBeenetWorkerExe=$pwd\target\release\beenet-worker.exe" `
            "/DBeenetAppExe=$pwd\target\release\Beenet.exe" `
            "/DBeenetOutputDir=$pwd\out\windows" `
            deploy\windows\Beenet.iss
          Get-ChildItem out\windows | Format-Table Name, Length

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: BeenetSetup-x64
          path: beenet/out/windows/BeenetSetup-x64.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: beenet
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          tag="${{ github.ref_name }}"
          gh release view "$tag" >/dev/null 2>&1 || \
            gh release create "$tag" --title "Beenet ${tag}" --generate-notes
          gh release upload "$tag" out/windows/BeenetSetup-x64.exe --clobber
