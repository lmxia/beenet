name: windows-contributor

on:
  pull_request:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: cargo check
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/'))
    runs-on: windows-2022
    steps:
      - name: Checkout Beenet
        uses: actions/checkout@v4
        with:
          path: beenet

      - name: Read Spin revision
        id: spin
        shell: bash
        run: echo "rev=$(tr -d '[:space:]' < beenet/scripts/spin.rev)" >> "$GITHUB_OUTPUT"

      - name: Checkout Spin
        uses: actions/checkout@v4
        with:
          repository: spinframework/spin
          ref: ${{ steps.spin.outputs.rev }}
          path: spin
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            beenet
            beenet/deploy/windows/app

      - name: Check beenet-worker
        working-directory: beenet
        run: cargo check -p beenet-worker

      - name: Check Windows app
        working-directory: beenet
        run: cargo check --manifest-path deploy/windows/app/Cargo.toml --target-dir target

  build:
    name: Windows x64 installer
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: windows-2022
    steps:
      - name: Checkout Beenet
        uses: actions/checkout@v4
        with:
          path: beenet

      - name: Read Spin revision
        id: spin
        shell: bash
        run: echo "rev=$(tr -d '[:space:]' < beenet/scripts/spin.rev)" >> "$GITHUB_OUTPUT"

      - name: Checkout Spin
        uses: actions/checkout@v4
        with:
          repository: spinframework/spin
          ref: ${{ steps.spin.outputs.rev }}
          path: spin
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            beenet
            beenet/deploy/windows/app

      - name: Build worker
        working-directory: beenet
        run: cargo build --release -p beenet-worker

      - name: Build Windows app
        working-directory: beenet
        run: cargo build --release --manifest-path deploy/windows/app/Cargo.toml --target-dir target

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Check code signing configuration
        id: signing
        shell: pwsh
        env:
          WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          $enabled = [bool]$env:WINDOWS_SIGNING_PFX_BASE64 -and [bool]$env:WINDOWS_SIGNING_PFX_PASSWORD
          "enabled=$($enabled.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          if ($enabled) {
            Write-Host 'Windows code signing is enabled.'
          } else {
            Write-Host 'Windows signing secrets are not configured; building an unsigned installer.'
          }

      - name: Import code signing certificate
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        env:
          WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_SIGNING_PFX_BASE64 -or -not $env:WINDOWS_SIGNING_PFX_PASSWORD) {
            throw 'Windows signing secrets are required for tag builds'
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'beenet-signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_SIGNING_PFX_BASE64))
          $password = ConvertTo-SecureString $env:WINDOWS_SIGNING_PFX_PASSWORD -AsPlainText -Force
          Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password | Out-Null

      - name: Locate SignTool
        if: steps.signing.outputs.enabled == 'true'
        id: signtool
        shell: pwsh
        run: |
          $tool = Get-ChildItem "$env:ProgramFiles(x86)\Windows Kits\10\bin" -Filter signtool.exe -Recurse |
            Where-Object { $_.FullName -match '\\x64\\signtool.exe$' } | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $tool) { throw 'signtool.exe not found' }
          "path=$($tool.FullName)" >> $env:GITHUB_OUTPUT

      - name: Compile installer
        working-directory: beenet
        shell: pwsh
        env:
          WINDOWS_SIGNING_ENABLED: ${{ steps.signing.outputs.enabled }}
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '0.1.0' }
          New-Item -ItemType Directory -Force -Path out\windows | Out-Null
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }
          if ($env:WINDOWS_SIGNING_ENABLED -eq 'true') {
            & "${{ steps.signtool.outputs.path }}" sign /fd SHA256 /a /tr http://timestamp.digicert.com /td SHA256 /d "Beenet" "$pwd\target\release\beenet-worker.exe"
            & "${{ steps.signtool.outputs.path }}" sign /fd SHA256 /a /tr http://timestamp.digicert.com /td SHA256 /d "Beenet" "$pwd\target\release\Beenet.exe"
          }
          & $iscc `
            "/DMyAppVersion=$version" `
            "/DBeenetWorkerExe=$pwd\target\release\beenet-worker.exe" `
            "/DBeenetAppExe=$pwd\target\release\Beenet.exe" `
            "/DBeenetOutputDir=$pwd\out\windows" `
            deploy\windows\Beenet.iss
          if ($env:WINDOWS_SIGNING_ENABLED -eq 'true') {
            & "${{ steps.signtool.outputs.path }}" sign /fd SHA256 /a /tr http://timestamp.digicert.com /td SHA256 /d "Beenet Installer" "$pwd\out\windows\BeenetSetup-x64.exe"
            & "${{ steps.signtool.outputs.path }}" verify /pa /v "$pwd\out\windows\BeenetSetup-x64.exe"
          }
          Get-ChildItem out\windows | Format-Table Name, Length

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: BeenetSetup-x64
          path: beenet/out/windows/BeenetSetup-x64.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: beenet
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          tag="${{ github.ref_name }}"
          gh release view "$tag" >/dev/null 2>&1 || \
            gh release create "$tag" --title "Beenet ${tag}" --generate-notes
          gh release upload "$tag" out/windows/BeenetSetup-x64.exe --clobber

      - name: Upload Hangzhou OSS
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: beenet
        env:
          OSS_ENDPOINT: https://oss-cn-hangzhou.aliyuncs.com
          OSS_BUCKET: beenet-hyperos-prod
          OSS_PREFIX: releases
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
        shell: bash
        run: |
          PY=python3
          command -v python3 >/dev/null || PY=python
          "$PY" -m pip install --user oss2 || "$PY" -m pip install --user --break-system-packages oss2
          "$PY" scripts/oss-upload-release.py "${{ github.ref_name }}" out/windows/BeenetSetup-x64.exe
