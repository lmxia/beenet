name: linux-worker

on:
  pull_request:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: cargo check
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Beenet
        uses: actions/checkout@v4
        with:
          path: beenet

      - name: Read Spin revision
        id: spin
        run: echo "rev=$(tr -d '[:space:]' < beenet/scripts/spin.rev)" >> "$GITHUB_OUTPUT"

      - name: Checkout Spin
        uses: actions/checkout@v4
        with:
          repository: spinframework/spin
          ref: ${{ steps.spin.outputs.rev }}
          path: spin
          submodules: recursive

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config cmake clang

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: beenet

      - name: Check beenet-worker
        working-directory: beenet
        run: cargo check -p beenet-worker

      - name: Check Linux install scripts
        working-directory: beenet
        run: |
          bash -n scripts/install-linux-worker.sh
          bash -n scripts/get-bworker.sh

  build:
    name: Linux ${{ matrix.arch }}
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Beenet
        uses: actions/checkout@v4
        with:
          path: beenet

      - name: Read Spin revision
        id: spin
        run: echo "rev=$(tr -d '[:space:]' < beenet/scripts/spin.rev)" >> "$GITHUB_OUTPUT"

      - name: Checkout Spin
        uses: actions/checkout@v4
        with:
          repository: spinframework/spin
          ref: ${{ steps.spin.outputs.rev }}
          path: spin
          submodules: recursive

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config cmake clang

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: beenet

      - name: Build release worker
        working-directory: beenet
        run: |
          uname -m
          make linux-worker-tarball
          ls -lh out/linux/

      - name: Upload tarball
        uses: actions/upload-artifact@v4
        with:
          name: beenet-worker-linux-${{ matrix.arch }}
          path: beenet/out/linux/*.tar.gz
          if-no-files-found: error

      - name: Upload installer
        if: matrix.arch == 'x86_64'
        uses: actions/upload-artifact@v4
        with:
          name: get-bworker.sh
          path: beenet/scripts/get-bworker.sh
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: beenet
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ github.ref_name }}"
          gh release view "$tag" >/dev/null 2>&1 || \
            gh release create "$tag" --title "Beenet ${tag}" --generate-notes
          gh release upload "$tag" out/linux/*.tar.gz scripts/get-bworker.sh --clobber
