# Public HTTP entrypoint. `make deploy` creates the shared routing Secret automatically.
# For manual deployments, run `make ensure-routing-secret` before applying manifests.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: beenet-frontdoor
  namespace: beenet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: beenet-frontdoor
  template:
    metadata:
      labels:
        app: beenet-frontdoor
    spec:
      containers:
        - name: frontdoor
          image: teethlink-global-registry-vpc.cn-hongkong.cr.aliyuncs.com/beenet/frontdoor:latest
          args:
            - "--http-addr"
            - "0.0.0.0:8080"
            - "--registry-url"
            - "http://beenet-registry:3030"
          env:
            - name: BEENET_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: beenet-routing-tokens
                  key: internal-token
            - name: BEENET_FRONTDOOR_TOKEN
              valueFrom:
                secretKeyRef:
                  name: beenet-routing-tokens
                  key: frontdoor-token
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
---
apiVersion: v1
kind: Service
metadata:
  name: beenet-frontdoor
  namespace: beenet
spec:
  type: ClusterIP
  selector:
    app: beenet-frontdoor
  ports:
    - name: http
      port: 80
      targetPort: http
