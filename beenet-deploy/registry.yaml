# beenet-registry
#
# Apply:
#   kubectl apply -f registry.yaml
#
# Get admin token:
#   kubectl logs -n beenet -l app=beenet-registry
#
# Replace image tags with your actual built images before applying.
---
apiVersion: v1
kind: Namespace
metadata:
  name: beenet
---
# ── Registry ────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: beenet-registry
  namespace: beenet
  labels:
    app: beenet-registry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: beenet-registry
  template:
    metadata:
      labels:
        app: beenet-registry
    spec:
      containers:
        - name: registry
          image: teethlink-global-registry-vpc.cn-hongkong.cr.aliyuncs.com/beenet/registry:latest
          imagePullPolicy: Always
          command:
            - /bin/sh
            - -ec
          args:
            - |
              exec beenet-registry \
                --http-addr 0.0.0.0:3030 \
                --redis-url "redis://:${REDIS_PASSWORD}@redis-master.redis.svc.cluster.local:6379/0"
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: beenet-redis-auth
                  key: redis-password
            - name: BEENET_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: beenet-routing-tokens
                  key: internal-token
          ports:
            - containerPort: 3030
          livenessProbe:
            httpGet:
              path: /health
              port: 3030
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3030
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: beenet-registry
  namespace: beenet
  labels:
    app: beenet-registry
spec:
  type: ClusterIP
  selector:
    app: beenet-registry
  ports:
    - port: 3030
      targetPort: 3030
