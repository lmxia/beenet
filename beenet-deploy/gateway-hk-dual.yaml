# Hong Kong dual gateway test deployment.
#
# Create two independent identity secrets first (do not commit identity.key):
#   kubectl -n beenet create secret generic beenet-gateway-a-identity \
#     --from-file=identity.key=./gateway-a.identity.key
#   kubectl -n beenet create secret generic beenet-gateway-b-identity \
#     --from-file=identity.key=./gateway-b.identity.key
#
# Apply:
#   kubectl apply -f gateway-hk-dual.yaml
#
# The public-addr values below use in-cluster DNS so workers running in the
# Hong Kong cluster can test Registry discovery immediately. For home/factory/PC
# workers, replace them with each Service LoadBalancer IP or public DNS:
#   /ip4/<gateway-a-lb-ip>/tcp/4001
#   /ip4/<gateway-b-lb-ip>/tcp/4001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: beenet-gateway-a
  namespace: beenet
  labels:
    app: beenet-gateway-a
    component: beenet-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: beenet-gateway-a
  template:
    metadata:
      labels:
        app: beenet-gateway-a
        component: beenet-gateway
    spec:
      containers:
        - name: gateway
          image: teethlink-global-registry.cn-hongkong.cr.aliyuncs.com/beenet/gateway:latest
          imagePullPolicy: Always
          args:
            - "--http-addr"
            - "0.0.0.0:8080"
            - "--registry-url"
            - "http://beenet-registry:3030"
            - "--registry-poll-ms"
            - "2000"
            - "--default-deadline-ms"
            - "10000"
            - "--gateway-id"
            - "hk-gateway-a"
            - "--region"
            - "hk"
            - "--capacity"
            - "1000"
            - "--libp2p-listen-addr"
            - "/ip4/0.0.0.0/tcp/4001"
            - "--public-addr"
            - "/dns4/beenet-gateway-a.beenet.svc.cluster.local/tcp/4001"
            - "--identity-key-path"
            - "/gateway_cache/identity.key"
          ports:
            - name: http
              containerPort: 8080
            - name: libp2p
              containerPort: 4001
          volumeMounts:
            - name: gateway-identity
              mountPath: /gateway_cache
              readOnly: true
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
      volumes:
        - name: gateway-identity
          secret:
            secretName: beenet-gateway-a-identity
            items:
              - key: identity.key
                path: identity.key
---
apiVersion: v1
kind: Service
metadata:
  name: beenet-gateway-a
  namespace: beenet
  labels:
    app: beenet-gateway-a
    component: beenet-gateway
spec:
  type: LoadBalancer
  selector:
    app: beenet-gateway-a
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: libp2p
      port: 4001
      targetPort: libp2p
---
