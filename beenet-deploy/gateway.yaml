# beenet-gateway
#
# Apply (after registry.yaml):
#   # One-time: create identity secret (do not commit the key file)
#   kubectl -n beenet create secret generic beenet-gateway-identity \
#     --from-file=identity.key=./identity.key
#   kubectl apply -f gateway.yaml
#
# Workers dial the public libp2p address (LB IP + stable PeerId from the secret).
# PeerId after apply:
#   kubectl -n beenet logs deploy/beenet-gateway | rg peer_id=
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: beenet-gateway
  namespace: beenet
  labels:
    app: beenet-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: beenet-gateway
  template:
    metadata:
      labels:
        app: beenet-gateway
    spec:
      containers:
        - name: gateway
          image: teethlink-global-registry.cn-hongkong.cr.aliyuncs.com/beenet/gateway:cid-cold-start-20260811
          imagePullPolicy: Always
          args:
            - "--http-addr"
            - "0.0.0.0:8080"
            - "--registry-url"
            - "http://beenet-registry:3030"
            - "--http-url"
            - "http://beenet-gateway:8080"
            - "--gateway-id"
            - "gateway-hk-1"
            - "--region"
            - "cn-hongkong"
            - "--libp2p-listen-addr"
            - "/ip4/0.0.0.0/tcp/4001"
            - "--public-addr"
            - "/ip4/47.242.13.246/tcp/4001"
            - "--identity-key-path"
            - "/gateway_cache/identity.key"
          env:
            - name: BEENET_FRONTDOOR_TOKEN
              valueFrom:
                secretKeyRef:
                  name: beenet-routing-tokens
                  key: frontdoor-token
          ports:
            - name: http
              containerPort: 8080
            - name: libp2p
              containerPort: 4001
          volumeMounts:
            - name: gateway-identity
              mountPath: /gateway_cache
              readOnly: true
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 512Mi
      volumes:
        - name: gateway-identity
          secret:
            secretName: beenet-gateway-identity
            items:
              - key: identity.key
                path: identity.key
---
apiVersion: v1
kind: Service
metadata:
  name: beenet-gateway
  namespace: beenet
  labels:
    app: beenet-gateway
spec:
  type: ClusterIP
  selector:
    app: beenet-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: beenet-gateway-libp2p
  namespace: beenet
  labels:
    app: beenet-gateway
spec:
  type: LoadBalancer
  selector:
    app: beenet-gateway
  ports:
    - name: libp2p
      port: 4001
      targetPort: libp2p
