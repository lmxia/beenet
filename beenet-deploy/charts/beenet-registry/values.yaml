# ── Registry image ─────────────────────────────────────────────────────────
image:
  repository: beenet/registry
  pullPolicy: IfNotPresent
  tag: ""  # defaults to .Chart.AppVersion

replicaCount: 1

httpAddr: "0.0.0.0:3030"

service:
  type: ClusterIP
  port: 3030

resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 512Mi

# ── Redis ───────────────────────────────────────────────────────────────────
# enabled=true  → deploy a single-pod Redis alongside the registry (default).
# enabled=false → skip Redis deployment; set externalRedis.url instead.
redis:
  enabled: true
  image: redis:7-alpine
  port: 6379
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi
  # Mount a PVC for Redis persistence. Set storageClass: "" to use the
  # cluster default. Set enabled: false to use emptyDir (data lost on restart).
  persistence:
    enabled: true
    storageClass: ""
    size: 1Gi

# ── External Redis (only used when redis.enabled=false) ─────────────────────
externalRedis:
  # Example: "redis://:mypassword@my-redis-svc:6379/0"
  url: ""

# ── Pod ─────────────────────────────────────────────────────────────────────
podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
