apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "beenet-gateway.fullname" . }}
  labels:
    {{- include "beenet-gateway.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "beenet-gateway.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "beenet-gateway.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: gateway
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - "--http-addr"
            - "{{ .Values.httpAddr }}"
            - "--registry-url"
            - "{{ .Values.registryUrl }}"
            - "--registry-poll-ms"
            - "{{ .Values.registryPollMs }}"
            - "--default-deadline-ms"
            - "{{ .Values.defaultDeadlineMs }}"
            - "--gateway-id"
            - "{{ .Values.gatewayId }}"
            {{- if .Values.region }}
            - "--region"
            - "{{ .Values.region }}"
            {{- end }}
            - "--capacity"
            - "{{ .Values.capacity }}"
            - "--libp2p-listen-addr"
            - "{{ .Values.libp2pListenAddr }}"
            {{- if .Values.publicAddr }}
            - "--public-addr"
            - "{{ .Values.publicAddr }}"
            {{- end }}
            - "--identity-key-path"
            - "{{ .Values.identityKeyPath }}"
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
            - name: libp2p
              containerPort: {{ .Values.service.libp2pPort }}
              protocol: TCP
          volumeMounts:
            - name: gateway-identity
              mountPath: /gateway_cache
              readOnly: true
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: gateway-identity
          secret:
            secretName: {{ .Values.identitySecretName }}
            items:
              - key: identity.key
                path: identity.key
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
