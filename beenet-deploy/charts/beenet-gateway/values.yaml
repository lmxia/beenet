# ── Image ──────────────────────────────────────────────────────────────────
image:
  repository: beenet/gateway
  pullPolicy: IfNotPresent
  tag: ""  # defaults to .Chart.AppVersion

# ── Replica ────────────────────────────────────────────────────────────────
replicaCount: 1

# ── Network ────────────────────────────────────────────────────────────────
httpAddr: "0.0.0.0:8080"
libp2pListenAddr: "/ip4/0.0.0.0/tcp/4001"
publicAddr: ""
httpUrl: ""
frontdoorTokenSecretName: "beenet-routing-tokens"
frontdoorTokenSecretKey: "frontdoor-token"
# Persistent PeerId for workers to dial (reverse long connection).
# Mounted read-only from Secret `identitySecretName` (key: identity.key).
identityKeyPath: "/gateway_cache/identity.key"
identitySecretName: "beenet-gateway-identity"

service:
  # Use LoadBalancer or NodePort to expose the gateway externally.
  type: LoadBalancer
  port: 8080
  libp2pPort: 4001

# ── Registry ────────────────────────────────────────────────────────────────
# URL of the beenet-registry service (in-cluster).
# If deployed with the beenet-registry chart in the same namespace:
#   http://<release-name>-beenet-registry:<port>
registryUrl: "http://beenet-registry:3030"
gatewayId: "gateway"
region: ""
capacity: 1000

# How often (ms) the gateway polls the registry for live workers.
registryPollMs: 2000

# Default invoke deadline sent to workers (milliseconds).
defaultDeadlineMs: 10000

# ── Resources ───────────────────────────────────────────────────────────────
resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 512Mi

# ── Pod ─────────────────────────────────────────────────────────────────────
podAnnotations: {}
podSecurityContext: {}
securityContext: {}
nodeSelector: {}
tolerations: []
affinity: {}

serviceAccount:
  create: false
  name: ""
