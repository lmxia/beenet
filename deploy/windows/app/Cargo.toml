[package]
name = "beenet-windows-app"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
license = "Apache-2.0"
publish = false
description = "Beenet Windows contributor app. Not part of the Spin workspace."

[workspace]

[[bin]]
name = "Beenet"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.32", default-features = true }
egui = "0.32"
open = "5"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
