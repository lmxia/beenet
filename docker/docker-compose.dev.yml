# Local stack: Redis + MinIO + registry + gateway + dashboard (worker runs on the host).
#
# Prefer the phased helper (creates gateway join token before starting gateway):
#   ./scripts/dev-up.sh up [--build]
#   ./scripts/dev-up.sh down
#
# Manual (not recommended): registry must be up and a gateway join token file must
# exist at ../.beenet-dev/gateway-join-token before `up beenet-gateway`.
#
# Admin token (fixed for local compose): beenet-dev-admin-token
# Dashboard: http://127.0.0.1:8081
# Gateway HTTP: http://127.0.0.1:18080  libp2p: 14001
# MinIO: http://127.0.0.1:9000  console:9001 (minioadmin / minioadmin)

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done;
      mc mb local/beenet --ignore-existing;
      mc anonymous set download local/beenet;
      echo 'MinIO bucket beenet ready (anonymous download)';
      "

  beenet-registry:
    image: beenet/beenet-registry:dev
    build:
      context: ..
      dockerfile: docker/Dockerfile.registry
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
    depends_on:
      - redis
    ports:
      - "3030:3030"
    command:
      - "--http-addr"
      - "0.0.0.0:3030"
      - "--redis-url"
      - "redis://redis:6379"
      - "--admin-token"
      - "beenet-dev-admin-token"

  beenet-gateway:
    image: beenet/beenet-gateway:dev
    build:
      context: ..
      dockerfile: docker/Dockerfile.gateway
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
    depends_on:
      - beenet-registry
    ports:
      - "18080:8080"
      - "14001:4001"
    volumes:
      - gateway-cache:/gateway_cache
      # Created by ./scripts/dev-up.sh before this service starts.
      - ../.beenet-dev/gateway-join-token:/run/secrets/gateway-join-token:ro
    command:
      - "--http-addr"
      - "0.0.0.0:8080"
      - "--registry-url"
      - "http://beenet-registry:3030"
      - "--libp2p-listen-addr"
      - "/ip4/0.0.0.0/tcp/4001"
      - "--public-addr"
      # Host workers dial the published libp2p port; avoid host.docker.internal
      # (may fail DNS resolution on some macOS setups).
      - "/ip4/127.0.0.1/tcp/14001"
      - "--identity-key-path"
      - "/gateway_cache/identity.key"
      - "--name"
      - "local-gw"
      - "--join-token-file"
      - "/run/secrets/gateway-join-token"

  beenet-dashboard:
    image: beenet/beenet-dashboard:dev
    build:
      context: ..
      dockerfile: docker/Dockerfile.dashboard
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
    depends_on:
      - beenet-registry
    ports:
      - "8081:80"
    environment:
      REGISTRY_UPSTREAM: http://beenet-registry:3030

volumes:
  minio-data:
  gateway-cache:
